# Serviços de apoio para desenvolvimento local.
# Uso: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vidra
      POSTGRES_USER: vidra
      POSTGRES_PASSWORD: vidra
    ports:
      - "${VIDRA_PG_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gotenberg:
    # Gera o PDF do laudo a partir de HTML.
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"

  mailpit:
    # Caixa de e-mail local para ver laudos e convites enviados.
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres:
